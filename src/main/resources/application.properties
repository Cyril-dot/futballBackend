# ============================================================
# SpeedBet API — application.properties
# All secrets and config values are read from environment variables.
# Copy .env.example to .env and fill in real values.
# ============================================================

spring.application.name=speedbet-api
server.port=8080

# ✅ Database ——————————————————————————————————————————————
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ✅ JPA / Hibernate ————————————————————————————————————————
# update = Hibernate automatically updates the schema based on your entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.jpa.open-in-view=false

# ✅ Startup optimization ———————————————————————————————————
spring.main.lazy-initialization=true

# ✅ Flyway ————————————————————————————————————————————————
# Flyway is DISABLED — Hibernate handles all schema changes
spring.flyway.enabled=false

# ✅ JWT ———————————————————————————————————————————————————
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-minutes=${JWT_ACCESS_TTL_MINUTES:30}
app.jwt.refresh-token-expiry-days=${JWT_REFRESH_TTL_DAYS:14}

# ✅ 2FA ———————————————————————————————————————————————————
app.2fa.issuer=${APP_2FA_ISSUER:SpeedBet}
app.2fa.window=${APP_2FA_WINDOW:1}

# ✅ Payments — Paystack ————————————————————————————————————
app.paystack.secret-key=${PAYSTACK_SECRET_KEY}
app.paystack.public-key=${PAYSTACK_PUBLIC_KEY}
app.paystack.webhook-secret=${PAYSTACK_WEBHOOK_SECRET}
app.paystack.base-url=https://api.paystack.co

# ✅ Payments — Stripe ——————————————————————————————————————
app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# ✅ Payments — Moolre (GHS MoMo USSD Direct Charge) ————————
app.moolre.api-user=${MOOLRE_API_USER}
app.moolre.public-key=${MOOLRE_PUBLIC_KEY}
app.moolre.account-number=${MOOLRE_ACCOUNT_NUMBER}
app.moolre.webhook-secret=${MOOLRE_WEBHOOK_SECRET}

# ✅ Email — Gmail SMTP ————————————————————————————————————
app.email.gmail-address=${GMAIL_ADDRESS}
app.email.gmail-app-password=${GMAIL_APP_PASSWORD}

# Brevo SMTP
app.email.brevo-api-key=${BREVO_UPDATED_APII_KEY:hahdhadhdkladjafkk}
